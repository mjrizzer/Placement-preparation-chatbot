name: Validate application
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: placement
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: placement_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U placement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://placement:ci_only_password@127.0.0.1:5432/placement_test?schema=public
      TEST_DATABASE_URL: postgresql://placement:ci_only_password@127.0.0.1:5432/placement_test?schema=public
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npx tsx prisma/seed.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: placement
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password in your local environment}
      POSTGRES_DB: placement
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - placement_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U placement']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  placement_db:
